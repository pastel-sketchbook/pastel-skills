name: ps-topcoat-patterns-eval
description: Evaluation suite for ps-topcoat-patterns skill
skill: ps-topcoat-patterns
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 600
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-5
graders:
  - type: text
    name: no_generic_advice
    config:
      not_contains:
        - "here are some general web framework patterns"
        - "topcoat is not a rust framework"
      regex_not_match:
        - "(?i)(tonic::|ratatui|actix_web::)"
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.75
tasks:
  - "tasks/*.yaml"
